<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Login – Gram SCS</title>
  {% include 'admin/_theme_head.html' %}
</head>
<body class="login-page">
  <main class="login-layout">
    <div class="login-topline"><a href="{{ url_for('index') }}"><i class="fa fa-arrow-left me-2" aria-hidden="true"></i>Admin Home</a>{% include 'admin/_theme_toggle.html' %}</div>
    <div class="surface-panel login-shell">
      <div class="login-header">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Gram SCS Logo" />
        <span class="page-eyebrow">OPERATIONS WORKSPACE</span>
        <h1>Admin Login</h1><p>Welcome back. Sign in to keep things moving.</p>
      </div>
      {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
      <form method="POST" action="{{ url_for('admin.login') }}" novalidate>
        <div class="mb-3"><label for="username" class="form-label">Username</label><input type="text" id="username" name="username" class="form-control" required autofocus autocomplete="username" placeholder="Enter username" /></div>
        <div class="mb-3"><label for="password" class="form-label">Password</label><input type="password" id="password" name="password" class="form-control" required autocomplete="current-password" placeholder="Enter password" /></div>
        <button type="submit" class="btn btn-primary login-btn">Sign In <i class="fa fa-arrow-right ms-2" aria-hidden="true"></i></button>
      </form>
      <p class="login-footnote">Gram SCS · Shipments. Labels. Customer enquiries.</p>
    </div>
  </main>
</body>
</html>
